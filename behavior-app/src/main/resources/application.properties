# Kafka source
kafka.brokers=localhost:9092
kafka.topic=user-behavior-events
kafka.group.id=user-behavior-marketing

# Marketing rules: false = bootstrap rules in code, true = broadcast rule topic
rules.broadcast.enabled=false
kafka.rule.topic=user-marketing-rules

# Rule repository: memory = bootstrap rules in code, mysql = MySQL 8 CRUD store
# (schema in docs/mysql-schema.sql). The password is NOT stored here:
# set the MYSQL_PASSWORD environment variable or pass --mysql.password=...
rules.repository=memory
mysql.url=jdbc:mysql://localhost:3306/user_behavior?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
mysql.user=root

# Cooldown: false = process-local checker, true = Redis SETNX (production)
cooldown.redis.enabled=false

# Redis (profile hash + high value ranking + coupon dedup)
redis.host=localhost
redis.port=6379

# Coupon service: http = REST API, kafka = reach-out topic
coupon.push.mode=http
coupon.endpoint=http://localhost:8080/api/coupons/push
kafka.coupon.topic=user-coupon-push-commands

# Pattern detection
cep.within.minutes=30
cart.timeout.minutes=30

# Job
job.parallelism=2
job.checkpoint.interval.ms=60000
